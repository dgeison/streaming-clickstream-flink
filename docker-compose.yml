services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: c3RyZWFtaW5nLWZsaW5rLWZsYWdzaGlwMg
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: streaming
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d streaming"]
      interval: 2s
      timeout: 3s
      retries: 15

  producer:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - .:/app
    entrypoint: ["python", "run_producer_cli.py"]

  flink-job:
    build: .
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      STREAMING_DB_HOST: postgres
      STREAMING_DB_PORT: "5432"
      STREAMING_DB_NAME: streaming
      STREAMING_DB_USER: stream
      STREAMING_DB_PASSWORD: stream
    volumes:
      - .:/app
      # /app/lib e criado durante o build da imagem (Dockerfile baixa os
      # connector jars do Flink ali). O bind mount acima (.:/app) sobrescreve
      # todo o /app com o checkout do host, que nao tem esses jars -- isso
      # quebrava a descoberta do connector 'kafka' em runtime (Task 8).
      # Este named volume fica "por cima" do bind mount so em /app/lib e o
      # Docker o popula com o conteudo da imagem no primeiro uso, preservando
      # os jars.
      - flink-libs:/app/lib
    entrypoint: ["python", "run_jobs_cli.py"]

  test:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STREAMING_DB_HOST: postgres
      STREAMING_DB_PORT: "5432"
      STREAMING_DB_NAME: streaming
      STREAMING_DB_USER: stream
      STREAMING_DB_PASSWORD: stream
    volumes:
      - .:/app
    entrypoint: ["pytest"]

volumes:
  flink-libs:
